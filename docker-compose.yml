services:
  postgres:
    image: postgres:16-alpine
    container_name: congreso_nfc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-congreso_nfc}
      POSTGRES_USER: ${POSTGRES_USER:-congreso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Superadministrador}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Define SUPER_ADMIN_EMAIL en el archivo .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Define SUPER_ADMIN_PASSWORD en el archivo .env}
      TZ: America/Mexico_City
    ports:
      - "5433:5432"
    volumes:
      - congreso_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  congreso_postgres_data:

